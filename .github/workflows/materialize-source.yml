name: Materialize v1.2 source

on:
  push:
    paths:
      - '.source/C_Disk_Slim_Helper_v1.2.ps1.gz.b64'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild PowerShell source
        shell: bash
        run: |
          python - <<'PY'
          import base64, gzip, pathlib
          src = pathlib.Path('.source/C_Disk_Slim_Helper_v1.2.ps1.gz.b64')
          out = pathlib.Path('C_Disk_Slim_Helper_v1.2.ps1')
          out.write_bytes(gzip.decompress(base64.b64decode(src.read_text().strip())))
          PY
      - name: Commit generated source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add C_Disk_Slim_Helper_v1.2.ps1
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "feat: materialize v1.2 PowerShell source"
          git push
